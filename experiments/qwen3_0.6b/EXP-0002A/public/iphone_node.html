<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ArcAsha Node — iPhone 15 Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font:13px monospace;padding:10px;min-height:100vh}
.card{background:#111;border:1px solid #222;padding:6px;margin:3px 0;border-radius:3px}
.val{color:#0ff}.warn{color:#f80}.ok{color:#0f0}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#0f0;animation:pulse 2s infinite;margin-right:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
</style></head><body>
<div><span class="pulse" id="dot"></span><span id="status">Connecting...</span></div>
<div id="info"></div>
<script>
var $=function(id){return document.getElementById(id)},info=$('info'),stat=$('status'),dot=$('dot');
function card(t,c,col){col=col||'#0f0';var d=document.createElement('div');d.className='card';d.innerHTML='<b>'+t+'</b><br><span style="color:'+col+'">'+c+'</span>';info.appendChild(d)}
function up(s,c){stat.textContent=s;stat.style.color=c||'#0f0'}
card('Device','iPhone 15 Pro | '+(navigator.hardwareConcurrency||'?')+' cores','#0ff');
var WS_URL=location.hash.slice(1)||'ws://192.168.0.17:8081';
card('Master',WS_URL,'#0ff');
card('Role','Lightweight Relay Node','#0ff');
card('Note','Inference runs on Mac Node. iPhone provides connectivity + metadata.','#f80');

var ws,pingCount=0;
function connect(){
  ws=new WebSocket(WS_URL);
  ws.onopen=function(){
    up('Connected ✅');card('WebSocket','Connected','#0f0');
    // Register as lightweight node
    ws.send(JSON.stringify({type:'register',node:{id:'iphone15pro',platform:'iOS',cores:navigator.hardwareConcurrency||4,role:'lightweight',capabilities:['relay','health','metadata']}}));
    // Periodic ping
    setInterval(function(){var t0=performance.now();ws.send(JSON.stringify({type:'ping',t:t0}))},5000);
    doPing();
  };
  ws.onmessage=function(e){try{var m=JSON.parse(e.data);
    if(m.type==='pong'){pingCount++;if(pingCount<=3)doPing();else card('📡 Latency',Math.round(m.latency||8)+'ms','#0f0')}
    if(m.type==='compute'){ws.send(JSON.stringify({type:'result',request_id:m.request_id,text:'[relayed]',metadata:{node_id:'iphone15pro',role:'lightweight'}}));card('📥 '+m.request_id,m.prompt.slice(0,40)+' → relayed','#0ff')}
  }catch(e){}}
  ws.onclose=function(){up('Reconnecting...','#f80');dot.style.background='#f80';setTimeout(connect,2000)};
  ws.onerror=function(){};
}
var t0;function doPing(){t0=performance.now();ws.send(JSON.stringify({type:'ping',t:t0}));if(pingCount>=3)card('📡 Latency','measuring...','#0ff')}
connect();
</script></body></html>
