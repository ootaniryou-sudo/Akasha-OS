<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArcAsha Node — iPhone 15 Pro</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:#0f0;font:12px monospace;padding:8px;min-height:100vh}
  h3{color:#0f0;margin:6px 0 3px;font-size:13px}
  .card{background:#111;border:1px solid #222;padding:6px;margin:3px 0;border-radius:3px}
  .val{color:#0ff}.warn{color:#f80}.err{color:#f00}.ok{color:#0f0}
  .pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#0f0;animation:pulse 2s infinite;margin-right:6px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
  button{background:#0f0;color:#000;border:none;padding:6px 12px;margin:4px;border-radius:3px;font:bold 12px monospace}
  button:disabled{background:#333;color:#666}
</style>
</head>
<body>
<div><span class="pulse" id="dot"></span><span id="status">Initializing...</span></div>
<div id="info"></div>
<script type="importmap">
{ "imports": { "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3/+esm" } }
</script>
<script type="module">
import { pipeline } from '@huggingface/transformers';

const $=id=>document.getElementById(id), info=$('info'), stat=$('status'), dot=$('dot');
function card(t,c,col='#0f0'){const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${t}</b><br><span style="color:${col}">${c}</span>`;info.appendChild(d)}
function up(s,c){stat.textContent=s;stat.style.color=c||'#0f0'}

// ── System ──────────────────────────────────────────────────────
card('Platform',navigator.platform,'#0ff');
card('CPU',(navigator.hardwareConcurrency||'?')+' cores','#0ff');
card('Memory',(navigator.deviceMemory||'?')+' GB','#0ff');
const WS_URL=location.hash.slice(1)||'ws://192.168.0.17:8081';
card('Master',WS_URL,'#0ff');

// ── WebGPU ──────────────────────────────────────────────────────
let gpuOk=false;
if('gpu' in navigator){
  try{const a=await navigator.gpu.requestAdapter();gpuOk=!!a;card('WebGPU',gpuOk?'✅ A17 Pro':'⚠️ no adapter',gpuOk?'#0f0':'#f80')}
  catch(e){card('WebGPU','❌ blocked','#f80')}
}else{card('WebGPU','❌ not supported','#f80')}
if(!gpuOk) card('Hint','Safari → Settings → Advanced → Feature Flags → WebGPU','#f80');

// ── Load Model ──────────────────────────────────────────────────
up('Loading Qwen3-0.6B...');
card('Model','Qwen3-0.6B (onnx-community)','#0ff');
const tLoad=performance.now();
let generator;
try{
  generator=await pipeline('text-generation','onnx-community/Qwen3-0.6B-ONNX',{
    device:gpuOk?'webgpu':'wasm',dtype:'q4f16'
  });
  card('Model Loaded',((performance.now()-tLoad)/1000).toFixed(1)+'s',gpuOk?'#0f0':'#f80');
  card('Backend',gpuOk?'WebGPU ⚡':'WASM 🐢',gpuOk?'#0f0':'#f80');
}catch(e){
  card('Load Error',e.message,'#f00');up('Model load failed','#f00');
}

// ── WebSocket ───────────────────────────────────────────────────
let ws;
function connectWS(){
  return new Promise((res,rej)=>{
    ws=new WebSocket(WS_URL);
    const t=setTimeout(()=>rej(new Error('timeout')),8000);
    ws.onopen=()=>{clearTimeout(t);up('Connected ✅');card('WebSocket','Connected','#0f0');res()};
    ws.onmessage=async ev=>{
      try{const m=JSON.parse(ev.data);
        if(m.type==='compute'&&generator){
          card('📥 '+m.request_id,m.prompt.slice(0,40)+'...','#0ff');
          const t0=performance.now();
          try{
            const out=await generator(m.prompt,{max_new_tokens:m.max_new_tokens||16,temperature:0,do_sample:false});
            const text=out[0].generated_text||'';
            const tokens=text.split(' ').length; // approximate
            const ms=performance.now()-t0;
            ws.send(JSON.stringify({type:'result',request_id:m.request_id,
              tokens:[],text, timing:{total_ms:Math.round(ms)},
              metadata:{node_id:'iphone15pro',backend:gpuOk?'webgpu':'wasm',platform:'iOS-Safari',cores:navigator.hardwareConcurrency||4}
            }));
            card('📤 '+m.request_id,`${tokens} tokens, ${ms.toFixed(0)}ms`,'#0f0');
          }catch(e){card('Infer Error',e.message,'#f00')}
        }
      }catch(e){}
    };
    ws.onerror=()=>{clearTimeout(t);up('WS Error ❌','#f00');dot.style.background='#f00';rej(new Error('ws'))};
    ws.onclose=()=>{up('Disconnected','#f80');dot.style.background='#f80'};
  });
}

// ── Main ─────────────────────────────────────────────────────────
(async()=>{
  up('Connecting WS...');
  try{await connectWS();up('Ready ✅ — waiting for compute');}
  catch(e){up('WS failed: '+e.message,'#f00')}
})().catch(e=>up(e.message,'#f00'));
</script>
</body>
</html>
