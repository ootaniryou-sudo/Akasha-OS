<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akasha Edge Node</title>
  <style>
    :root {
      --bg0: #0c1210;
      --bg1: #152019;
      --ink: #e8f0ea;
      --mute: #8aa192;
      --accent: #3dba7a;
      --warn: #d4a017;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a3328 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #1c2830 0%, transparent 50%),
        var(--bg0);
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { width: min(420px, 100%); }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 500;
      letter-spacing: 0.04em;
      font-size: 1.75rem;
      margin: 0 0 0.35rem;
    }
    p { color: var(--mute); margin: 0 0 1.5rem; line-height: 1.5; }
    label { display: block; font-size: 0.75rem; color: var(--mute); margin-bottom: 0.35rem; }
    input, select, button {
      width: 100%;
      padding: 0.7rem 0.85rem;
      margin-bottom: 0.9rem;
      border: 1px solid #2a3b31;
      border-radius: 2px;
      background: var(--bg1);
      color: var(--ink);
      font: inherit;
    }
    button {
      background: var(--accent);
      color: #04140c;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #log {
      margin-top: 1rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      line-height: 1.45;
      color: var(--mute);
      max-height: 220px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .ok { color: var(--accent); }
    .warn { color: var(--warn); }
  </style>
</head>
<body>
  <main>
    <h1>Akasha</h1>
    <p>エッジ端末ノード — バイナリ WebSocket + WebGPU 専門家推論</p>
    <label for="url">Master WebSocket</label>
    <input id="url" value="ws://127.0.0.1:8080" />
    <label for="nodeId">Node ID</label>
    <input id="nodeId" value="3001" />
    <label for="cluster">Cluster</label>
    <select id="cluster">
      <option value="1">general_expert</option>
      <option value="2" selected>math_expert</option>
      <option value="3">code_expert</option>
      <option value="99">shadow_pool</option>
    </select>
    <button id="connect">メッシュに参加</button>
    <div id="log"></div>
  </main>
  <script type="module">
    // Minimal inline binary client (mirrors src/binary + src/client).
    const MAGIC = 0x414B5348;
    const HEADER = 48;
    const Cmd = { REGISTER: 1, HEARTBEAT: 2, COMPUTE_TASK: 3, RESULT: 4 };

    function encode(buf, h, payload) {
      const dv = new DataView(buf);
      const payloadBytes = payload ? payload.byteLength : 0;
      dv.setUint32(0, MAGIC, false);
      dv.setUint8(4, 1);
      dv.setUint8(5, h.command);
      dv.setUint16(6, h.flags || 0, true);
      dv.setBigUint64(8, h.txId, true);
      dv.setBigUint64(16, h.nodeId, true);
      dv.setUint32(24, h.clusterId, true);
      dv.setUint32(28, payloadBytes, true);
      dv.setBigUint64(32, h.timestampUs, true);
      dv.setUint32(40, h.expectedUs || 0, true);
      dv.setUint32(44, h.seq || 0, true);
      if (payload) new Float32Array(buf, HEADER, payload.length).set(payload);
      return HEADER + payloadBytes;
    }

    function decodeHeader(buf) {
      const dv = new DataView(buf);
      if (dv.getUint32(0, false) !== MAGIC) throw new Error('bad magic');
      return {
        command: dv.getUint8(5),
        flags: dv.getUint16(6, true),
        txId: dv.getBigUint64(8, true),
        nodeId: dv.getBigUint64(16, true),
        clusterId: dv.getUint32(24, true),
        payloadLen: dv.getUint32(28, true),
        timestampUs: dv.getBigUint64(32, true),
        seq: dv.getUint32(44, true),
      };
    }

    const logEl = document.getElementById('log');
    const log = (msg, cls) => {
      const line = document.createElement('div');
      if (cls) line.className = cls;
      line.textContent = msg;
      logEl.prepend(line);
    };

    let ws = null;
    let hb = null;

    document.getElementById('connect').onclick = async () => {
      const url = document.getElementById('url').value;
      const nodeId = BigInt(document.getElementById('nodeId').value);
      const clusterId = Number(document.getElementById('cluster').value);
      ws = new WebSocket(url);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        const buf = new ArrayBuffer(HEADER);
        encode(buf, {
          command: Cmd.REGISTER,
          txId: 0n,
          nodeId,
          clusterId,
          timestampUs: BigInt(Math.floor(performance.now() * 1000)),
        });
        ws.send(buf);
        log('REGISTER sent', 'ok');
        hb = setInterval(() => {
          const b = new ArrayBuffer(HEADER);
          encode(b, {
            command: Cmd.HEARTBEAT,
            txId: 0n,
            nodeId,
            clusterId,
            timestampUs: BigInt(Math.floor(performance.now() * 1000)),
          });
          ws.send(b);
        }, 500);
      };
      ws.onmessage = (ev) => {
        const ab = ev.data;
        const h = decodeHeader(ab);
        if (h.command !== Cmd.COMPUTE_TASK) return;
        const input = new Float32Array(ab, HEADER, h.payloadLen >> 2);
        const out = new Float32Array(input.length);
        for (let i = 0; i < input.length; i++) out[i] = Math.tanh(input[i] * 1.13 + 0.03);
        const outBuf = new ArrayBuffer(HEADER + out.byteLength);
        const len = encode(outBuf, {
          command: Cmd.RESULT,
          flags: h.flags,
          txId: h.txId,
          nodeId,
          clusterId: h.clusterId,
          timestampUs: h.timestampUs,
          seq: h.seq,
        }, out);
        ws.send(outBuf.slice(0, len));
        log(`COMPUTE → RESULT tx=${h.txId} n=${out.length}`, 'ok');
      };
      ws.onclose = () => {
        clearInterval(hb);
        log('disconnected', 'warn');
      };
      document.getElementById('connect').disabled = true;
    };
  </script>
</body>
</html>
