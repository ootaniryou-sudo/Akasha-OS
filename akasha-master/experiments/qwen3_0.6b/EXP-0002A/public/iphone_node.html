<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ArcAsha Node</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0f0;font:13px monospace;padding:10px}
.card{background:#111;border:1px solid #222;padding:6px;margin:3px 0;border-radius:3px}
.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#0f0;animation:pulse 2s infinite;margin-right:6px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.2}}
</style></head><body>
<div><span class="pulse" id="dot"></span><span id="status">Connecting...</span></div>
<div id="info"></div>
<script>
var $=function(id){return document.getElementById(id)},info=$('info'),stat=$('status'),dot=$('dot');
function card(t,c){var d=document.createElement('div');d.className='card';d.innerHTML='<b>'+t+'</b><br>'+c;info.appendChild(d)}
var WS_URL=location.hash.slice(1)||'ws://192.168.0.17:8081';
card('Device','iPhone | '+navigator.platform+' | '+(navigator.hardwareConcurrency||'?')+' cores');
card('Master',WS_URL);
card('Role','Lightweight Relay Node');

var ws=new WebSocket(WS_URL);
ws.onopen=function(){
  stat.textContent='Connected ✅';stat.style.color='#0f0';
  card('WS','Connected','#0f0');
  ws.send(JSON.stringify({type:'register',node:{id:'iphone15pro',platform:'iOS',role:'lightweight'}}));
  // Single ping
  var t0=performance.now();ws.send(JSON.stringify({type:'ping',t:t0}));
  ws.addEventListener('message',function h(e){try{if(JSON.parse(e.data).type==='pong'){ws.removeEventListener('message',h);card('Latency',Math.round(performance.now()-t0)+'ms','#0f0')}}catch(e){}},{once:true});
};
ws.onmessage=function(e){try{var m=JSON.parse(e.data);if(m.type==='compute'){card('📥 '+m.request_id,m.prompt.slice(0,40)+'...');ws.send(JSON.stringify({type:'result',request_id:m.request_id,text:'[relayed]',metadata:{node_id:'iphone15pro',role:'lightweight'}}))}}catch(e){}}
ws.onclose=function(){stat.textContent='Disconnected';stat.style.color='#f80';dot.style.background='#f80';card('WS','Closed — reload page','#f80')};
ws.onerror=function(){stat.textContent='Error';stat.style.color='#f00'};
</script></body></html>
