[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arcasha-router"
version = "0.1.0"
description = "Observation-Driven Adaptive Routing (ODAR) — belief-driven routing engine for heterogeneous LLM pools. Python port of @arcasha/router (ArcAsha core)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["routing", "bandit", "linucb", "llm", "orchestration", "belief", "arcasha"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ootaniryou-sudo/ArcAsha-os"
Repository = "https://github.com/ootaniryou-sudo/ArcAsha-os"

[tool.setuptools.packages.find]
include = ["arcasha_router*"]
