<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Akasha Edge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #07110d;
      --bg1: #0d1c15;
      --ink: #e7f2ea;
      --mute: #7f9a88;
      --line: #1e3328;
      --go: #2fce7a;
      --busy: #e0b84a;
      --bad: #e05a4f;
      --glow: rgba(47, 206, 122, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg0);
      color: var(--ink);
      font-family: "Syne", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(900px 520px at 50% -8%, #163526 0%, transparent 58%),
        radial-gradient(700px 400px at 100% 100%, #102028 0%, transparent 45%),
        linear-gradient(180deg, #0a1510 0%, var(--bg0) 40%, #050a08 100%);
      padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
    }

    .shell {
      width: min(440px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 1.35rem;
    }

    header {
      display: grid;
      gap: 0.35rem;
      animation: rise 0.7s ease both;
    }

    .brand {
      font-size: clamp(2rem, 9vw, 2.6rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .brand span {
      color: var(--go);
      text-shadow: 0 0 24px var(--glow);
    }

    .tag {
      color: var(--mute);
      font-size: 0.92rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .pulse-ring {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
      position: relative;
    }

    .pulse-ring > i {
      position: absolute;
      inset: 0 auto 0 0;
      width: 32%;
      background: linear-gradient(90deg, transparent, var(--go), transparent);
      animation: sweep 2.4s ease-in-out infinite;
      opacity: 0.85;
    }

    .pulse-ring[data-live="0"] > i { animation: none; opacity: 0.2; width: 8%; background: var(--bad); }

    .panel {
      border-top: 1px solid var(--line);
      padding-top: 1rem;
      display: grid;
      gap: 0.85rem;
      animation: rise 0.8s ease both;
      animation-delay: 0.08s;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--mute);
      box-shadow: 0 0 0 0 transparent;
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .dot.idle { background: var(--go); box-shadow: 0 0 12px var(--glow); }
    .dot.computing {
      background: var(--busy);
      animation: blink 0.9s ease-in-out infinite;
    }
    .dot.offline, .dot.error, .dot.boot, .dot.connecting { background: var(--bad); }

    .hb {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.72rem;
      color: var(--mute);
    }
    .hb.ok { color: var(--go); }
    .hb.bad { color: var(--bad); }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 1rem;
    }

    .metric {
      display: grid;
      gap: 0.2rem;
      min-height: 3.2rem;
    }

    .metric .k {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      font-weight: 500;
    }

    .metric .v {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 1.05rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .metric .v small {
      font-size: 0.72rem;
      color: var(--mute);
      margin-left: 0.2rem;
    }

    .vram {
      display: grid;
      gap: 0.4rem;
    }

    .vram-bar {
      height: 8px;
      background: #122018;
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .vram-bar > b {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #1d8f55, var(--go));
      transition: width 0.35s ease;
    }

    .form {
      display: grid;
      gap: 0.55rem;
      animation: rise 0.85s ease both;
      animation-delay: 0.14s;
    }

    label {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
    }

    input, select, button {
      width: 100%;
      font: inherit;
      border-radius: 2px;
      border: 1px solid var(--line);
      background: var(--bg1);
      color: var(--ink);
      padding: 0.75rem 0.85rem;
    }

    input, select {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.85rem;
    }

    button {
      margin-top: 0.35rem;
      border: none;
      background: var(--go);
      color: #04140c;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:active { transform: scale(0.98); }
    button:disabled { filter: grayscale(0.5); opacity: 0.55; cursor: default; }
    button.secondary {
      background: transparent;
      color: var(--mute);
      border: 1px solid var(--line);
    }

    .actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0.55rem; }

    .foot {
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.68rem;
      color: var(--mute);
      line-height: 1.5;
      min-height: 2.6rem;
      animation: rise 0.9s ease both;
      animation-delay: 0.2s;
    }

    .foot .err { color: var(--bad); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes sweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(420%); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">Aka<span>sha</span></div>
      <p class="tag">エッジ推論ノード · WebGPU Worker</p>
      <div class="pulse-ring" id="pulse" data-live="0"><i></i></div>
    </header>

    <section class="panel" aria-label="node status">
      <div class="status-row">
        <div class="status-pill">
          <span class="dot" id="dot"></span>
          <span id="statusText">BOOT</span>
        </div>
        <div class="hb bad" id="hb">HEARTBEAT —</div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="k">GPU Latency</div>
          <div class="v" id="lat">— <small>µs</small></div>
        </div>
        <div class="metric">
          <div class="k">EWMA</div>
          <div class="v" id="ewma">— <small>µs</small></div>
        </div>
        <div class="metric">
          <div class="k">Layer</div>
          <div class="v" id="layer">—</div>
        </div>
        <div class="metric">
          <div class="k">Tasks</div>
          <div class="v" id="tasks">0</div>
        </div>
      </div>

      <div class="vram">
        <div class="status-row">
          <div class="k" style="letter-spacing:0.08em;text-transform:uppercase;font-size:0.68rem;color:var(--mute)">VRAM Pool</div>
          <div class="v" id="vramTxt" style="font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--mute)">0 / 0 MB</div>
        </div>
        <div class="vram-bar" aria-hidden="true"><b id="vramBar"></b></div>
      </div>

      <div class="metric">
        <div class="k">GPU / Tx</div>
        <div class="v" id="gpuTx" style="font-size:0.82rem;color:var(--mute)">—</div>
      </div>
    </section>

    <section class="form">
      <div>
        <label for="url">Master WebSocket</label>
        <input id="url" value="ws://127.0.0.1:8080" autocomplete="off" spellcheck="false" />
      </div>
      <div>
        <label for="nodeId">Node ID (≤16 ASCII)</label>
        <input id="nodeId" value="phone-edge-01" maxlength="16" autocomplete="off" />
      </div>
      <div>
        <label for="cluster">Cluster</label>
        <select id="cluster">
          <option value="1">general_expert</option>
          <option value="2" selected>math_expert</option>
          <option value="3">code_expert</option>
          <option value="99">shadow_pool</option>
        </select>
      </div>
      <div class="actions">
        <button type="button" id="btnConnect">メッシュに参加</button>
        <button type="button" id="btnDisconnect" class="secondary" disabled>切断</button>
      </div>
    </section>

    <p class="foot" id="foot">UI スレッドは描画のみ。推論・WS・WebGPU は Worker 内。</p>
  </div>

  <script>
    /**
     * Main thread: paint-only. No WebSocket, no WebGPU, no binary parse.
     * Stats arrive via worker postMessage; DOM updates are rAF-coalesced.
     */
    const $ = (id) => document.getElementById(id);
    const statusText = $('statusText');
    const dot = $('dot');
    const hb = $('hb');
    const lat = $('lat');
    const ewma = $('ewma');
    const layer = $('layer');
    const tasks = $('tasks');
    const vramTxt = $('vramTxt');
    const vramBar = $('vramBar');
    const gpuTx = $('gpuTx');
    const pulse = $('pulse');
    const foot = $('foot');
    const btnConnect = $('btnConnect');
    const btnDisconnect = $('btnDisconnect');

    let pending = null;
    let raf = 0;
    let wakeLock = null;

    const worker = new Worker('./worker-inference.js', { type: 'module' });

    function fmtUs(v) {
      if (v == null || v <= 0) return '—';
      if (v >= 1000) return (v / 1000).toFixed(2) + ' <small>ms</small>';
      return Math.round(v).toLocaleString() + ' <small>µs</small>';
    }

    function fmtBytes(n) {
      return (n / (1024 * 1024)).toFixed(2);
    }

    function paint(s) {
      const st = (s.status || 'boot').toUpperCase();
      statusText.textContent = st;
      dot.className = 'dot ' + (s.status || 'boot');

      const live = s.wsState === 1 && s.heartbeatOk;
      pulse.dataset.live = live ? '1' : '0';
      hb.className = 'hb ' + (live ? 'ok' : 'bad');
      const age = s.lastHeartbeatAgeMs >= 0 ? Math.round(s.lastHeartbeatAgeMs) + 'ms' : '—';
      hb.textContent = live ? 'HEARTBEAT OK · ' + age : 'HEARTBEAT LOST';

      lat.innerHTML = fmtUs(s.lastLatencyUs);
      ewma.innerHTML = fmtUs(s.ewmaLatencyUs);
      layer.textContent = s.layerId >= 0 ? String(s.layerId) : '—';
      tasks.textContent = String(s.tasksDone || 0);

      const used = s.vramBytes || 0;
      const cap = s.vramCapBytes || 1;
      vramTxt.textContent = fmtBytes(used) + ' / ' + fmtBytes(cap) + ' MB';
      vramBar.style.width = Math.min(100, (used / cap) * 100).toFixed(1) + '%';

      gpuTx.textContent = (s.gpuName || '—') + ' · ' + (s.txId || '—');

      if (s.error) {
        foot.innerHTML = '<span class="err">' + s.error + '</span>';
      } else {
        foot.textContent = 'UI 60fps idle · Worker が WS / unpack / WebGPU を独占';
      }

      const linked = s.wsState === 1;
      btnConnect.disabled = linked || s.status === 'connecting';
      btnDisconnect.disabled = !linked && s.status !== 'connecting';
    }

    function schedulePaint(s) {
      pending = s;
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        if (pending) paint(pending);
        pending = null;
      });
    }

    worker.onmessage = (ev) => {
      if (ev.data && ev.data.type === 'stats') schedulePaint(ev.data);
    };

    worker.onerror = (err) => {
      foot.innerHTML = '<span class="err">Worker error: ' + (err.message || err) + '</span>';
    };

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (_) { /* optional */ }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    btnConnect.onclick = () => {
      worker.postMessage({
        type: 'configure',
        url: $('url').value.trim(),
        nodeId: $('nodeId').value.trim().slice(0, 16),
        clusterId: Number($('cluster').value),
      });
      worker.postMessage({
        type: 'connect',
        url: $('url').value.trim(),
      });
      requestWakeLock();
    };

    btnDisconnect.onclick = () => {
      worker.postMessage({ type: 'disconnect' });
    };
  </script>
</body>
</html>
